    function formatRupiah(amount) {
      return "Rp " + new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 }).format(Math.max(0, Math.round(amount)));

    function generateOrderNumber() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const rnd = Math.floor(1000 + Math.random() * 9000);
      return `DMS-${y}${m}${day}-${rnd}`;
    }

      useEffect(() => {
        if (!supabaseClient) return;
        let isMounted = true;

        async function syncWithSupabase() {
          try {
            const { data: prodData, error: prodErr } = await supabaseClient
              .from("products")
              .select("*, product_variants(*)")
              .order("created_at", { ascending: true });

            if (!prodErr && prodData && prodData.length > 0 && isMounted) {
              setProducts(prodData);
              setSupabaseConnected(true);
            } else if (!prodErr && isMounted) {
              setSupabaseConnected(true);
            }

            const { data: ordData, error: ordErr } = await supabaseClient
              .from("orders")
              .select("*, order_items(*, products(name), product_variants(variant_name))")
              .order("created_at", { ascending: false });

            if (!ordErr && ordData && ordData.length > 0 && isMounted) {
              const mappedOrders = ordData.map((o) => ({
                ...o,
                order_items: (o.order_items || []).map((it) => ({
                  id: it.id,
                  product_name: it.products?.name || it.product_name || "Menu Dimsum",
                  variant_name: it.product_variants?.variant_name || it.variant_name || "Reguler",
                  quantity: it.quantity,
                  unit_price: it.unit_price,
                  item_notes: it.item_notes
                }))
              }));
              setOrders(mappedOrders);
            }
          } catch {}
        }

        syncWithSupabase();

        const channel = supabaseClient
          .channel("realtime-dimsum-live")
          .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => {
            syncWithSupabase();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "products" }, () => {
            syncWithSupabase();
          })
          .subscribe();

        return () => {
          isMounted = false;
          supabaseClient.removeChannel(channel);
        };

                <div className="no-print flex justify-end gap-2">
                  <button onClick={() => setReceiptOrder(null)} className="rounded-xl border px-3 py-1.5 text-xs font-bold">Tutup</button>
                  <button onClick={() => window.print()} className="rounded-xl bg-terracotta-600 px-4 py-1.5 text-xs font-bold text-white">🖨️ Print 58mm</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
